<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Shield outline -->
  <path
    d="M24 4L6 11v13c0 10.5 7.5 18.7 18 21 10.5-2.3 18-10.5 18-21V11L24 4z"
    fill="none"
    stroke="#00E5FF"
    stroke-width="1.6"
    stroke-linejoin="round"
    opacity="0.5"
  />

  <!-- Wave band across the middle of the shield -->
  <clipPath id="shieldClip">
    <path d="M24 5.5L7 12v12c0 10 7 17.8 17 20 10-2.2 17-10 17-20V12L24 5.5z"/>
  </clipPath>

  <!-- Water fill (lower half) -->
  <rect x="6" y="26" width="36" height="18" fill="#0B1120" clip-path="url(#shieldClip)"/>

  <!-- Wave 1 -->
  <path
    d="M6 27 Q12 23 18 27 Q24 31 30 27 Q36 23 42 27"
    fill="none"
    stroke="#00E5FF"
    stroke-width="1.8"
    stroke-linecap="round"
    opacity="0.9"
  />
  <!-- Wave 2 -->
  <path
    d="M6 31 Q12 27 18 31 Q24 35 30 31 Q36 27 42 31"
    fill="none"
    stroke="#1DE9B6"
    stroke-width="1.4"
    stroke-linecap="round"
    opacity="0.65"
  />

  <!-- Coral left branch -->
  <path
    d="M15 40 L15 33 Q14 30 11 29"
    fill="none"
    stroke="#1DE9B6"
    stroke-width="1.7"
    stroke-linecap="round"
    stroke-linejoin="round"
    clip-path="url(#shieldClip)"
  />
  <path
    d="M15 36 Q13 34 11 34"
    fill="none"
    stroke="#1DE9B6"
    stroke-width="1.4"
    stroke-linecap="round"
    clip-path="url(#shieldClip)"
  />
  <circle cx="11" cy="29" r="1.4" fill="#1DE9B6" clip-path="url(#shieldClip)"/>
  <circle cx="11" cy="34" r="1.1" fill="#1DE9B6" clip-path="url(#shieldClip)"/>
  <circle cx="15" cy="33" r="1.1" fill="#1DE9B6" clip-path="url(#shieldClip)"/>

  <!-- Coral centre -->
  <path
    d="M24 42 L24 33"
    fill="none"
    stroke="#00E5FF"
    stroke-width="1.8"
    stroke-linecap="round"
    clip-path="url(#shieldClip)"
  />
  <path
    d="M24 38 Q21.5 36 20 34"
    fill="none"
    stroke="#00E5FF"
    stroke-width="1.4"
    stroke-linecap="round"
    clip-path="url(#shieldClip)"
  />
  <path
    d="M24 36 Q26.5 34 28 32"
    fill="none"
    stroke="#00E5FF"
    stroke-width="1.4"
    stroke-linecap="round"
    clip-path="url(#shieldClip)"
  />
  <circle cx="24" cy="33" r="1.3" fill="#00E5FF" clip-path="url(#shieldClip)"/>
  <circle cx="20" cy="34" r="1.1" fill="#00E5FF" clip-path="url(#shieldClip)"/>
  <circle cx="28" cy="32" r="1.1" fill="#00E5FF" clip-path="url(#shieldClip)"/>

  <!-- Coral right branch -->
  <path
    d="M33 40 L33 33 Q34 30 37 29"
    fill="none"
    stroke="#1DE9B6"
    stroke-width="1.7"
    stroke-linecap="round"
    stroke-linejoin="round"
    clip-path="url(#shieldClip)"
  />
  <path
    d="M33 36 Q35 34 37 34"
    fill="none"
    stroke="#1DE9B6"
    stroke-width="1.4"
    stroke-linecap="round"
    clip-path="url(#shieldClip)"
  />
  <circle cx="37" cy="29" r="1.4" fill="#1DE9B6" clip-path="url(#shieldClip)"/>
  <circle cx="37" cy="34" r="1.1" fill="#1DE9B6" clip-path="url(#shieldClip)"/>
  <circle cx="33" cy="33" r="1.1" fill="#1DE9B6" clip-path="url(#shieldClip)"/>

  <!-- Sensor dot at top of shield (monitoring) -->
  <circle cx="24" cy="18" r="2.5" fill="#00E5FF" opacity="0.9"/>
  <circle cx="24" cy="18" r="4.5" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.35"/>
  <circle cx="24" cy="18" r="7" fill="none" stroke="#00E5FF" stroke-width="0.7" opacity="0.18"/>
</svg>
